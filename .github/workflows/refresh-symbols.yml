name: refresh-symbols

on:
  schedule:
    - cron: "0 23 * * 0-4" # 평일(월~금) 08:00 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/symbols.manual.json
      - scripts/fetch-krx-symbols.ts

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fetch:symbols
      - id: diff
        run: |
          if git diff --quiet -- scripts/symbols.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- scripts/symbols.json
          fi
      - if: steps.diff.outputs.changed == 'true' || github.event_name != 'schedule'
        run: |
          if [ -z "$WRANGLER_CONFIG" ]; then
            echo "::error::GitHub Actions Variables에 WRANGLER_CONFIG를 등록해야 합니다."
            exit 1
          fi
          printf '%s\n' "$WRANGLER_CONFIG" > wrangler.jsonc
          npm run seed:symbols
        env:
          WRANGLER_CONFIG: ${{ vars.WRANGLER_CONFIG }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/symbols.json
          git commit -m "chore: refresh KRX symbol list"
          git push
