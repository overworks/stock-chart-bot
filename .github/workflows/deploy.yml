name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: cp wrangler.jsonc.example wrangler.jsonc
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir dist

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Restore Wrangler configuration
        env:
          WRANGLER_CONFIG: ${{ vars.WRANGLER_CONFIG }}
        run: |
          if [ -z "$WRANGLER_CONFIG" ]; then
            echo "::error::GitHub Actions Variables에 WRANGLER_CONFIG를 등록해야 합니다."
            exit 1
          fi
          printf '%s\n' "$WRANGLER_CONFIG" > wrangler.jsonc
      - run: npm ci
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
