name: cleanup-images

on:
  schedule:
    - cron: "0 18 * * *" # 매일 03:00 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supabase:
    if: vars.SUPABASE_PROJECT_REF != ''
    runs-on: ubuntu-latest
    concurrency:
      group: supabase-production-${{ vars.SUPABASE_PROJECT_REF }}
      cancel-in-progress: false
    env:
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run cleanup:images:supabase
