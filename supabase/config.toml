project_id = "stock-chart-bot"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = true
file_size_limit = "5MiB"

[storage.s3_protocol]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.stock-chart-bot]
verify_jwt = false
entrypoint = "./functions/stock-chart-bot/index.ts"
static_files = ["./functions/stock-chart-bot/_assets/*"]
